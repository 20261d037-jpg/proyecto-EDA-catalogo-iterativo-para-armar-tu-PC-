const CATS={CPU:'Procesador',GPU:'Tarjeta Gráfica',MB:'Placa Madre',RAM:'Memoria RAM',STORAGE:'Almacenamiento',PSU:'Fuente de Poder',COOLER:'Refrigeración',CASE:'Gabinete'};
const ICONS={CPU:'◉',GPU:'▣',MB:'▤',RAM:'▤',STORAGE:'▥',PSU:'◈',COOLER:'◉',CASE:'▥'};

function getProduct(id){return inventory.find(p=>p.id===id)||null}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0)}
function countBuild(){return Object.values(state.build).filter(Boolean).length}
function getBuildProducts(){return Object.values(state.build).map(getProduct).filter(Boolean)}
function totalPrice(){return getBuildProducts().reduce((s,p)=>s+p.price,0)}
function totalPower(){return getBuildProducts().reduce((s,p)=>s+(p.power||0),0)}
function imgError(e){e.target.src='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><rect width="100%" height="100%" fill="#0a1d34"/><text x="50%" y="47%" text-anchor="middle" fill="#58c8ff" font-size="26" font-family="Arial">PC BUILDER</text><text x="50%" y="57%" text-anchor="middle" fill="#718ba8" font-size="15" font-family="Arial">Imagen no disponible</text></svg>`);e.target.onerror=null}

/* ---------------- COMPATIBILIDAD ---------------- */
function compatibility(){
 const b=getBuildProducts(), cpu=getProduct(state.build.CPU), mb=getProduct(state.build.MB), ram=getProduct(state.build.RAM), gpu=getProduct(state.build.GPU), psu=getProduct(state.build.PSU), cs=getProduct(state.build.CASE);
 const rules=[];
 if(cpu&&mb) rules.push({key:'cpu',label:'CPU + Placa Madre',ok:cpu.socket===mb.socket,detail:`${cpu.socket} vs ${mb.socket}`}); else rules.push({key:'cpu',label:'CPU + Placa Madre',ok:null,detail:'Faltan componentes'});
 if(ram&&mb) rules.push({key:'ram',label:'RAM + Placa Madre',ok:ram.ramType===mb.ramType,detail:`${ram.ramType} vs ${mb.ramType}`}); else rules.push({key:'ram',label:'RAM + Placa Madre',ok:null,detail:'Faltan componentes'});
 if(gpu&&psu){const required=Math.ceil((totalPower()+gpu.power)*1.35);rules.push({key:'gpu',label:'GPU + Fuente',ok:psu.wattage>=required,detail:`Fuente ${psu.wattage} W · recomendado ≥ ${required} W`})}else rules.push({key:'gpu',label:'GPU + Fuente',ok:null,detail:'Faltan componentes'});
 if(cs&&mb) rules.push({key:'case',label:'Gabinete + Placa',ok:cs.form.includes(mb.form)||cs.form.includes('ATX')&&mb.form==='mATX',detail:`${cs.form} · ${mb.form}`}); else rules.push({key:'case',label:'Gabinete + Placa',ok:null,detail:'Faltan componentes'});
 const evaluated=rules.filter(r=>r.ok!==null), passed=evaluated.filter(r=>r.ok).length;
 let score=evaluated.length?Math.round((passed/evaluated.length)*100):0;
 if(!evaluated.length) score=0;
 return {rules,score,complete:countBuild()===8,hasError:rules.some(r=>r.ok===false)};
}
function canAdd(p){
 const next={...state.build,[p.cat]:p.id}; const old=state.build; state.build=next; const c=compatibility(); state.build=old;
 return !c.hasError;
}
function setBuild(cat,id){state.build[cat]=id;persist();render();toast(`${CATS[cat]} actualizado: ${getProduct(id).name}`)}
function removeBuild(cat){state.build[cat]=null;persist();render();toast(`${CATS[cat]} eliminado de la build`)}

/* ---------------- ROUTER ---------------- */
const routes=['home','build','products','guides','trends','benchmarks','forums'];
function normalizeRoute(){let r=location.hash.replace('#/','')||'home';return routes.includes(r)?r:'home'}
function navigate(route){if(!routes.includes(route))route='home';if(location.hash!==`#/${route}`)location.hash=`#/${route}`;else render()}
window.addEventListener('hashchange',render);

function render(){state.route=normalizeRoute();document.querySelectorAll('#topNav button').forEach(b=>b.classList.toggle('active',b.dataset.route===state.route));document.querySelectorAll('.side-item[data-side]').forEach(b=>b.classList.toggle('active',state.route==='build'&&(state.productFilter==='ALL'?b.dataset.side==='all':b.dataset.side===state.productFilter)));const main=document.getElementById('appMain');main.innerHTML=views[state.route]();bindViewEvents();updateGlobalUI()}

function recommendationCard(title,profile,price,desc,items){return `<article class="rec-card"><h3>${title}</h3><p>${desc}</p><div class="rec-price">${price}</div><ul class="mini-list">${items.map(x=>`<li>✓ ${x}</li>`).join('')}</ul><button class="btn primary" data-preset="${title}">Cargar configuración</button></article>`}
function buildRows(){return Object.entries(CATS).map(([cat,label])=>{const p=getProduct(state.build[cat]);return `<tr><td><div class="part"><div class="part-icon">${ICONS[cat]}</div><strong>${label}</strong></div></td><td>${p?`<img class="thumb" src="${p.img}" onerror="imgError(event)" alt="${escapeHtml(p.name)}">`:'<span class="empty">—</span>'}</td><td>${p?`<div class="model"><b>${escapeHtml(p.brand)} ${escapeHtml(p.name)}</b><span>${escapeHtml(p.specs)}</span></div>`:'<span class="empty">Ningún componente seleccionado</span>'}</td><td>${p?`<div class="spec"><span>${p.socket?`Socket: ${p.socket} · `:''}${p.ramType?`Memoria: ${p.ramType} · `:''}${p.wattage?`Fuente: ${p.wattage} W · `:''}</span><span>Consumo asignado: ${p.power||0} W</span></div>`:'<span class="empty">Selecciona una pieza para completar esta fila.</span>'}</td><td>${p?`<span class="price">${money(p.price)}</span>`:'—'}</td><td>${p?`<span class="stock">● ${p.stock>5?'En stock':'Stock limitado'}</span>`:'—'}</td><td><div class="row-actions"><button class="icon-btn" data-action="choose" data-cat="${cat}" title="Reemplazar">↔</button>${p?`<button class="icon-btn" data-action="detail" data-id="${p.id}" title="Detalles">i</button><button class="icon-btn delete" data-action="delete" data-cat="${cat}" title="Eliminar">⌫</button>`:''}</div></td></tr>`}).join('')}
function bottomCompatibility(){const c=compatibility();return `<div class="bottom-panels"><section class="compat-panel"><div class="compat-line"><div class="score-circle" style="--score:${c.score}%"><span>${c.score}%</span></div><div class="compat-copy"><b>${c.hasError?'Hay incompatibilidades que requieren atención':c.complete?'Build compatible':'Compatibilidad parcial'}</b><small>${c.complete?'Todas las categorías están cubiertas.':`Tienes ${countBuild()} de 8 categorías seleccionadas.`}</small></div><button class="btn ${c.hasError?'danger':'primary'}" data-action="compat" ${c.hasError?'disabled':''}>✓ Análisis completo</button></div><div class="checks">${c.rules.map(r=>`<div class="check ${r.ok===false?'bad':''}">${r.ok===true?'●':'○'} ${r.label}<small>${r.ok===true?'Compatible':r.ok===false?'Revisar':'Pendiente'}</small></div>`).join('')}</div></section><section class="totals-panel"><div class="total-item"><span>Precio total estimado</span><b class="price">${money(totalPrice())}</b></div><div class="total-item"><span>⚡ Consumo estimado</span><b>${totalPower()} W</b></div></section></div>`}
function productCard(p){const compatible=canAdd(p);return `<article class="product-card"><img src="${p.img}" onerror="imgError(event)" alt="${escapeHtml(p.brand+' '+p.name)}"><h3>${escapeHtml(p.brand)} ${escapeHtml(p.name)}</h3><div class="brand">${CATS[p.cat]} · ${p.stock>5?'En stock':'Stock limitado'}</div><div class="specs">${escapeHtml(p.specs)}<br>${p.power?`${p.power} W · `:''}${p.wattage?`${p.wattage} W PSU · `:''}${p.socket||''}</div><div class="product-footer"><span class="product-price">${money(p.price)}</span><div class="product-actions"><button class="btn tiny" data-action="detail" data-id="${p.id}">Detalles</button><button class="btn primary tiny" data-action="add" data-id="${p.id}" ${compatible?'':'disabled'}>${compatible?'Añadir':'Incompatible'}</button></div></div></article>`}
function filteredProducts(cat,q){const query=(q||'').toLowerCase().trim();return inventory.filter(p=>(cat==='ALL'||p.cat===cat)&&(!query||`${p.brand} ${p.name} ${p.specs} ${p.cat}`.toLowerCase().includes(query)))}
function emptyState(){return `<div class="panel-card" style="grid-column:1/-1;text-align:center;padding:35px"><h3>No encontramos componentes</h3><p style="color:#718ba7;margin-top:5px">Prueba otra búsqueda o limpia los filtros.</p></div>`}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}

/* ---------------- EVENTOS ---------------- */
function bindViewEvents(){
 document.querySelectorAll('[data-action="goBuild"]').forEach(b=>b.onclick=()=>navigate('build'));
 document.querySelectorAll('[data-action="goProducts"]').forEach(b=>b.onclick=()=>navigate('products'));
 document.querySelectorAll('[data-action="compat"]').forEach(b=>b.onclick=()=>openCompat());
 document.querySelectorAll('[data-action="save"]').forEach(b=>b.onclick=saveBuild);
 document.querySelectorAll('[data-action="reset"]').forEach(b=>b.onclick=resetBuild);
 document.querySelectorAll('[data-action="catalogAll"]').forEach(b=>b.onclick=()=>openCatalog('ALL'));
 document.querySelectorAll('[data-action="choose"]').forEach(b=>b.onclick=()=>openCatalog(b.dataset.cat));
 document.querySelectorAll('[data-action="delete"]').forEach(b=>b.onclick=()=>removeBuild(b.dataset.cat));
 document.querySelectorAll('[data-action="detail"]').forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
 document.querySelectorAll('[data-action="add"]').forEach(b=>b.onclick=()=>{const p=getProduct(b.dataset.id);setBuild(p.cat,p.id);navigate('build')});
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.productFilter=b.dataset.filter;state.productQuery='';render()});
 document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>loadPreset(b.dataset.preset));
 document.querySelectorAll('[data-action="clearFilters"]').forEach(b=>b.onclick=()=>{state.productFilter='ALL';state.productQuery='';render()});
 const ps=document.getElementById('productSearch'); if(ps)ps.oninput=e=>{state.productQuery=e.target.value;const grid=document.querySelector('.product-grid');if(grid)grid.innerHTML=filteredProducts(state.productFilter,state.productQuery).map(productCard).join('')||emptyState();bindProductButtons()};
 const hs=document.getElementById('homeSearch'); if(hs)hs.onkeydown=e=>{if(e.key==='Enter')doHomeSearch(hs.value)};
 const hsb=document.querySelector('[data-action="homeSearchBtn"]');if(hsb)hsb.onclick=()=>doHomeSearch(document.getElementById('homeSearch').value);
 const bp=document.getElementById('benchProfile');if(bp){bp.onchange=renderBenchmark;renderBenchmark()}
 const np=document.querySelector('[data-action="newPost"]');if(np)np.onclick=()=>toast('Demo: formulario de nuevo tema listo para conectar con una API.');
}
function bindProductButtons(){document.querySelectorAll('[data-action="detail"]').forEach(b=>b.onclick=()=>openDetail(b.dataset.id));document.querySelectorAll('[data-action="add"]').forEach(b=>b.onclick=()=>{const p=getProduct(b.dataset.id);setBuild(p.cat,p.id);navigate('build')})}
function doHomeSearch(q){state.productFilter='ALL';state.productQuery=q||'';navigate('products')}

/* ---------------- SIDEBAR / GLOBAL ---------------- */
document.getElementById('topNav').addEventListener('click',e=>{const b=e.target.closest('[data-route]');if(b)navigate(b.dataset.route)});
document.getElementById('sidebar').addEventListener('click',e=>{const b=e.target.closest('[data-side]');if(b){if(b.dataset.side==='all'){state.productFilter='ALL';navigate('build')}else{state.productFilter=b.dataset.side;navigate('products')}}const a=e.target.closest('[data-action="compat"]');if(a)openCompat()});
document.getElementById('resetBtn').onclick=resetBuild;
document.getElementById('profile').onchange=e=>{state.profile=e.target.value;persist();toast(`Perfil cambiado a ${e.target.options[e.target.selectedIndex].text}`)};
document.getElementById('globalSearch').onkeydown=e=>{if(e.key==='Enter')doHomeSearch(e.target.value)};
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close)document.getElementById(close.dataset.close).classList.remove('show');if(e.target.classList.contains('modal-bg'))e.target.classList.remove('show')});

/* ---------------- MODALES ---------------- */
function openCatalog(cat){state.catalogCategory=cat;state.catalogQuery='';state.catalogSort='default';document.getElementById('catalogTitle').textContent=cat==='ALL'?'Catálogo de componentes':`Catálogo: ${CATS[cat]}`;document.getElementById('catalogSubtitle').textContent=cat==='ALL'?'Elige una pieza para añadirla o reemplazarla.':`Selecciona un ${CATS[cat]} compatible con tu build.`;document.getElementById('catalogSearch').value='';document.getElementById('catalogModal').classList.add('show');renderCatalogModal()}
function renderCatalogModal(){let arr=filteredProducts(state.catalogCategory,state.catalogQuery);if(state.catalogSort==='low')arr.sort((a,b)=>a.price-b.price);if(state.catalogSort==='high')arr.sort((a,b)=>b.price-a.price);document.getElementById('catalogGrid').innerHTML=arr.map(p=>productCard(p)).join('');document.querySelectorAll('#catalogGrid [data-action="detail"]').forEach(b=>b.onclick=()=>openDetail(b.dataset.id));document.querySelectorAll('#catalogGrid [data-action="add"]').forEach(b=>b.onclick=()=>{const p=getProduct(b.dataset.id);setBuild(p.cat,p.id);document.getElementById('catalogModal').classList.remove('show');navigate('build')});}
document.getElementById('catalogSearch').oninput=e=>{state.catalogQuery=e.target.value;renderCatalogModal()};document.getElementById('catalogSort').onchange=e=>{state.catalogSort=e.target.value;renderCatalogModal()};
function openDetail(id){const p=getProduct(id);if(!p)return;document.getElementById('detailBody').innerHTML=`<div class="detail"><img src="${p.img}" onerror="imgError(event)" alt="${escapeHtml(p.name)}"><div><div class="eyebrow">${CATS[p.cat]}</div><h2>${escapeHtml(p.brand)} ${escapeHtml(p.name)}</h2><div class="sub">${escapeHtml(p.specs)}</div><div class="spec-grid"><div class="spec-box"><span>Precio</span><b class="price">${money(p.price)}</b></div><div class="spec-box"><span>Stock</span><b>${p.stock} unidades</b></div><div class="spec-box"><span>Consumo</span><b>${p.power||0} W</b></div><div class="spec-box"><span>Socket / Formato</span><b>${p.socket||p.form||'—'}</b></div><div class="spec-box"><span>Memoria / Interfaz</span><b>${p.ramType||p.interface||'—'}</b></div><div class="spec-box"><span>Marca</span><b>${escapeHtml(p.brand)}</b></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" data-modal-add="${p.id}">Añadir a Mi Build</button></div></div></div>`;document.getElementById('detailModal').classList.add('show');document.querySelector('[data-modal-add]').onclick=()=>{setBuild(p.cat,p.id);document.getElementById('detailModal').classList.remove('show');navigate('build')}}
function openCompat(){const c=compatibility();document.getElementById('compatGrid').innerHTML=c.rules.map(r=>`<div class="compat-box ${r.ok===false?'bad':r.ok===true?'ok':''}"><h3>${r.ok===true?'✓':'⚠'} ${r.label}</h3><p><strong>${r.ok===true?'Compatible':r.ok===false?'Revisar':'Pendiente'}</strong><br>${r.detail}</p></div>`).join('');document.getElementById('compatModal').classList.add('show')}

/* ---------------- PERSISTENCIA / PRESETS ---------------- */
function persist(){localStorage.setItem('pcbg_state',JSON.stringify({build:state.build,profile:state.profile}))}
function hydrate(){try{const saved=JSON.parse(localStorage.getItem('pcbg_state'));if(saved){state.build={...emptyBuild(),...(saved.build||{})};state.profile=saved.profile||'gaming'}}catch(e){console.warn('No se pudo recuperar el estado',e)}document.getElementById('profile').value=state.profile}
function saveBuild(){persist();toast('Build guardada en este navegador ✓')}
function resetBuild(){state.build={...defaultBuild};persist();render();toast('Build restablecida')}
function loadPreset(title){const presets={Entrada:{CPU:'cpu5600',GPU:'gpu4060',MB:'mbb550',RAM:'ram16',STORAGE:'nv21',PSU:'rm650',COOLER:'cool212',CASE:'caseh510'},'Calidad / Precio':{CPU:'cpu5700x',GPU:'gpu4060ti',MB:'mbb550',RAM:'ram32',STORAGE:'nv22',PSU:'rm750',COOLER:'cool240',CASE:'case4000'},'Gama Alta':{CPU:'cpu7800',GPU:'gpu4070s',MB:'mbb650',RAM:'ramcorsair',STORAGE:'sn850x',PSU:'rm850',COOLER:'h100',CASE:'case4000'}};state.build={...presets[title]};persist();toast(`Configuración ${title} cargada`);navigate('build')}

/* ---------------- BENCHMARK ---------------- */
function renderBenchmark(){const el=document.getElementById('benchmarkBars');if(!el)return;const profile=document.getElementById('benchProfile').value;const sets={gaming:[['RTX 4070 SUPER',100],['RX 7800 XT',92],['RTX 4060 Ti',71],['RTX 4060',57]],creator:[['RTX 4070 SUPER',100],['RX 7800 XT',88],['RTX 4060 Ti',75],['RTX 4060',63]],budget:[['RTX 4060',100],['RTX 4060 Ti',112],['RX 7800 XT',145],['RTX 4070 SUPER',168]]};const data=sets[profile];const max=Math.max(...data.map(x=>x[1]));el.innerHTML=data.map(x=>`<div class="bar-row"><span class="bar-label">${x[0]}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(x[1]/max*100)}%"></div></div><span class="bar-val">${x[1]}</span></div>`).join('')}

/* ---------------- UI GLOBAL ---------------- */
function updateGlobalUI(){const c=compatibility();document.getElementById('countAll').textContent=`${countBuild()}/8`;document.getElementById('sideScore').textContent=`${c.score}%`;document.getElementById('profile').value=state.profile;const gs=document.getElementById('globalSearch');if(gs&&state.route==='products')gs.value=state.productQuery;const bc=document.getElementById('buildCount');if(bc)bc.textContent=`${countBuild()}/8`;const be=document.getElementById('buildEstimate');if(be)be.textContent=money(totalPrice());const bp=document.getElementById('buildPower');if(bp)bp.textContent=`~ ${totalPower()} W`}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2200)}

hydrate();
if(!location.hash)location.hash='#/home';else render();
</script>
</body>
</html>
